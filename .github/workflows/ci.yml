# CI for @kama/tls. Copied in shape from @kama/sodium's workflow.
#
# ⚠️ NOT YET SEEN GREEN. It pins kama v0.9.486; until that tag is published, the install step has nothing
# to resolve.
#
# The whole gate is tools/test.sh: every case is hermetic (in-memory pipes and loopback TCP), built debug
# AND release. Mbed TLS is vendored and compiled through `csources`, so nothing is installed on the runner.
# Windows is not in the matrix; the package has never been built there.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x64 }
          - { os: macos-14, name: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # Pinned rather than `latest`, so a compiler release cannot turn this repository red without a commit.
      - name: Install kama
        env:
          KAMA_VERSION: v0.9.486
        run: |
          curl -fsSL https://kama-lang.org/install.sh | sh
          echo "$HOME/.kama/bin" >> "$GITHUB_PATH"

      - name: Version
        run: kama --version

      - name: Test
        run: tools/test.sh
