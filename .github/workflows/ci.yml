# CI for @kama/tls.
#
# The whole gate is tools/test.sh: every case is hermetic (in-memory pipes and loopback TCP), built debug
# AND release. Mbed TLS is vendored and compiled through `csources`, so nothing is installed on the runner
# for the package itself. The test PKI needs OpenSSL 3 (tools/gen-certs.sh says why), which the Linux image
# has, macOS has through Homebrew rather than as /usr/bin/openssl, and Windows has in Git Bash.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x64 }
          - { os: macos-14, name: macos-arm64 }
          - { os: windows-latest, name: windows-x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash   # Git Bash on Windows
    env:
      # Pinned rather than `latest`, so a compiler release cannot turn this repository red without a commit. It is
      # the package's "kama" floor (kama.json), which the tests share (tests/kama.json), and is raised with it.
      KAMA_VERSION: v0.9.690
    steps:
      - uses: actions/checkout@v5

      - name: Install kama
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://kama-lang.org/install.sh | sh
          echo "$HOME/.kama/bin" >> "$GITHUB_PATH"

      # The release with zig bundled, so the C compiler is part of the pin. install.ps1 would choose the slim one,
      # because the image has C compilers, and slim kama compiles with whichever `clang` the image puts first on the
      # PATH. A Windows machine with no toolchain gets this same bundled release.
      - name: Install kama (Windows, with its bundled zig)
        if: runner.os == 'Windows'
        run: |
          asset="kama-windows-x64-bundled-$KAMA_VERSION.tar.gz"
          url="https://github.com/cosmic-canopy/kama/releases/download/$KAMA_VERSION/$asset"
          curl -fsSLO "$url"
          want=$(curl -fsSL "$url.sha256" | cut -d' ' -f1)
          echo "$want *$asset" | sha256sum -c -
          mkdir -p "$HOME/.kama/$KAMA_VERSION"
          tar -xzf "$asset" -C "$HOME/.kama/$KAMA_VERSION" --strip-components=1
          cygpath -w "$HOME/.kama/$KAMA_VERSION/bin" >> "$GITHUB_PATH"

      - name: OpenSSL 3 for the test PKI
        if: runner.os == 'macOS'
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "OPENSSL=$(brew --prefix openssl@3)/bin/openssl" >> "$GITHUB_ENV"

      - name: Version
        run: |
          kama --version
          "${OPENSSL:-openssl}" version

      - name: Test
        run: tools/test.sh
