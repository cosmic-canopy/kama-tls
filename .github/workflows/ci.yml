# CI for @kama/tls.
#
# The whole gate is tools/test.sh: every case is hermetic (in-memory pipes and loopback TCP), built debug
# AND release. Mbed TLS is vendored and compiled through `csources`, so nothing is installed on the runner
# for the package itself. The test PKI needs OpenSSL 3 (tools/gen-certs.sh says why), which the Linux image
# has and macOS has through Homebrew rather than as /usr/bin/openssl.
# Windows is not in the matrix yet: docs/ROADMAP.md, phase 7.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x64 }
          - { os: macos-14, name: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # Pinned rather than `latest`, so a compiler release cannot turn this repository red without a commit.
      # Two pins, each raised deliberately, in the same commit that raises the floor it mirrors: the package's
      # "kama" floor (kama.json), which builds the library alone, and the tests' (tests/kama.json), which runs
      # the gate. install.sh makes only a first install the default, so the tests' is named the default
      # explicitly: it is the `kama` on the PATH.
      - name: Install kama
        run: |
          curl -fsSL https://kama-lang.org/install.sh | KAMA_VERSION=v0.9.523 sh
          curl -fsSL https://kama-lang.org/install.sh | KAMA_SET_DEFAULT=1 KAMA_VERSION=v0.9.690 sh
          echo "$HOME/.kama/bin" >> "$GITHUB_PATH"

      - name: The package's floor
        run: |
          "$HOME/.kama/versions/v0.9.523/bin/kama" check kama.json
          "$HOME/.kama/versions/v0.9.523/bin/kama" build kama.json -o "$RUNNER_TEMP/tls-floor"

      - name: OpenSSL 3 for the test PKI
        if: runner.os == 'macOS'
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "OPENSSL=$(brew --prefix openssl@3)/bin/openssl" >> "$GITHUB_ENV"

      - name: Version
        run: |
          kama --version
          "${OPENSSL:-openssl}" version

      - name: Test
        run: tools/test.sh
