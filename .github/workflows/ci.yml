# CI for @kama/tls. Copied in shape from @kama/sodium's workflow.
#
# The whole gate is tools/test.sh: every case is hermetic (in-memory pipes and loopback TCP), built debug
# AND release. Mbed TLS is vendored and compiled through `csources`, so nothing is installed on the runner
# for the package itself. The test PKI needs OpenSSL 3 (tools/gen-certs.sh says why), which the Linux image
# has and macOS has through Homebrew rather than as /usr/bin/openssl.
# Windows is not in the matrix; the package has never been built there.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x64 }
          - { os: macos-14, name: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # Pinned rather than `latest`, so a compiler release cannot turn this repository red without a commit.
      # Raise it deliberately, in the same commit that raises the manifests' "kama" floor.
      - name: Install kama
        env:
          KAMA_VERSION: v0.9.523
        run: |
          curl -fsSL https://kama-lang.org/install.sh | sh
          echo "$HOME/.kama/bin" >> "$GITHUB_PATH"

      - name: OpenSSL 3 for the test PKI
        if: runner.os == 'macOS'
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "OPENSSL=$(brew --prefix openssl@3)/bin/openssl" >> "$GITHUB_ENV"

      - name: Version
        run: |
          kama --version
          "${OPENSSL:-openssl}" version

      - name: Test
        run: tools/test.sh
